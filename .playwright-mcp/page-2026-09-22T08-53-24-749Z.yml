      - paragraph [ref=f5e119]: Assalamu'alaikum Wr. Wb
      - paragraph [ref=f5e120]: Salam sejahtera bagi kita semua,
      - paragraph [ref=f5e121]: SMK Texmaco Semarang sebagai salah satu sekolah menengah kejuruan di Kota Semarang telah berdiri sejak tahun 1997 di bawah kepemilikan Yayasan PPIT Texmaco. Saat ini memiliki 7 (tujuh) jurusan yaitu Teknik Elektronika Industri, Teknik Kendaraan Ringan, Teknik Pemesinan, Teknik Pemintalan Serat Buatan, Teknik Komputer dan Jaringan, Rekayasa Perangkat Lunak dan Tata Busana. Dengan jumlah siswa 1523 pada tahun ajaran 2022/2023 ini, SMK Texmaco merupakan SMK swasta dengn jumlah siswa terbanyak di Kota Semarang.
